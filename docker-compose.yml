version: '3.8'

services:
  # Main Go Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        APP_PORT: ${APP_PORT:-8080}
    container_name: word-flashcard-backend
    image: fong/word-flashcard-backend
    network_mode: host
    environment:
      APP_PORT: ${APP_PORT:-8080}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      LOG_FILE_PATH: ${LOG_FILE_PATH:-word-flashcard.log}
      LOG_FILE_MAX_SIZE_MB: ${LOG_FILE_MAX_SIZE_MB:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_NOTIFY_LEVEL: ${LOG_NOTIFY_LEVEL:-WARN}
      LOG_STATE_FILE_PATH: ${LOG_STATE_FILE_PATH:-}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_DIR: ${BACKUP_DIR:-backups}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-72}
      BACKUP_CHECK_INTERVAL_HOURS: ${BACKUP_CHECK_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-10}
      DB_TYPE: ${DB_TYPE:-mysql}
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-word_flashcard}
      DEV_MODE: ${DEV_MODE:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${APP_PORT:-8080}/api/health"]
      interval: 10s
      timeout: 10s
      retries: 3
    volumes:
      - ${LOG_HOST_DIR:-.}:/root/logs
      - ${BACKUP_HOST_DIR:-./backups}:/root/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # React Frontend Service
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      network: host
      args:
        FRONTEND_PORT: ${FRONTEND_PORT:-3000}
        VITE_API_HOSTNAME: ${VITE_API_HOSTNAME:-localhost}
        VITE_API_PORT: ${VITE_API_PORT:-8080}
    container_name: word-flashcard-frontend
    image: fong/word-flashcard-frontend
    network_mode: host
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${FRONTEND_PORT:-3000}"]
      interval: 10s
      timeout: 10s
      retries: 3
    volumes:
      - ${TEMPLATE_CONFIG_HOST_DIR:-./web/public/config}:/app/build/config