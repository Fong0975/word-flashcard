name: Security Scan

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.ico'
      - '**/*.svg'
      - 'go.sum'
      - 'web/package-lock.json'
      - 'utils/cambridge-dictionary-api/pnpm-lock.yaml'
      - 'docs/swagger.json'
      - 'docs/swagger.yaml'
      - 'docs/docs.go'
      - 'dist/**'
      - 'VERSION'

jobs:
  gitleaks:
    name: Run Gitleaks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Only required if this repo moves under a GitHub Organization; not needed for personal accounts.
        # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
