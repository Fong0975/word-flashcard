name: Dependency Scan

on:
  schedule:
    # Runs on the 1st and 15th of each month (~biweekly) — cron has no native
    # "every N weeks" interval, so day-of-month is used as the closest approximation.
    - cron: '0 0 1,15 * *'
  workflow_dispatch: # Allow on-demand runs, e.g. right after bumping a dependency

concurrency:
  group: dependency-scan
  cancel-in-progress: false

jobs:
  sca:
    name: Run Trivy SCA
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Run Trivy dependency scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        severity: 'CRITICAL,HIGH'
        ignore-unfixed: true
        exit-code: '1'
